server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Zbudowane pliki mają hash w nazwie - można cache'ować długo
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: każda nieznana ścieżka (np. /blogs) wraca do index.html (React Router)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
