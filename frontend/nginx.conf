# Naglowek robots: indeksujemy tylko strone glowna, reszta (aplikacja, logowanie, nieznane adresy) dostaje noindex.
# Pusta wartosc oznacza, ze nginx w ogole nie doda naglowka.
map $request_uri $robots_header {
    default "noindex, nofollow";
    "~^/([?].*)?$" "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Pliki Vite maja hash w nazwie - mozna cache'owac dlugo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Brakujacy obrazek to 404, a nie index.html (inaczej <img> nie wie, ze sie nie zaladowal)
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # robots.txt i mapa strony: zwykle pliki, nigdy index.html
    location = /robots.txt {
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Prerenderowana wersja strony glownej (HTML z trescia dla wyszukiwarek); plik jest dostepny tylko tutaj
    location = /landing.html {
        internal;
    }
    location = / {
        try_files /landing.html /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }

    # SPA: kazda nieznana sciezka wraca do index.html (React Router)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_header always;
        include /etc/nginx/security-headers.inc;
    }
}
