server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pliki Vite maja hash w nazwie - mozna cache'owac dlugo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Brakujacy obrazek to 404, a nie index.html (inaczej <img> nie wie, ze sie nie zaladowal)
    location /img/ {
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # SPA: kazda nieznana sciezka wraca do index.html (React Router)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }
}
