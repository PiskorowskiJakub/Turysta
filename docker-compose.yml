services:
  # Wersja produkcyjna (nginx): docker compose up --build
  web:
    build:
      context: .
      target: production
    image: turysta-web
    container_name: turysta-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Wersja developerska z hot reload: docker compose --profile dev up --build web-dev
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: turysta-web-dev
    container_name: turysta-web-dev
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      # Polling potrzebny, gdy kod jest montowany z Windows do kontenera
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=${DEV_PORT:-3000}
      - CI=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    stdin_open: true
